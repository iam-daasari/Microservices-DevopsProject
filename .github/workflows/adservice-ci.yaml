name: Adservice CI Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/adservice/**"
      - ".github/workflows/adservice-ci.yaml"
  workflow_dispatch:

jobs:
  # Stage 1: Build & Unit Test
  build-and-test:
    name: "Build & Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Clean & Validate
        run: |
          cd src/adservice
          mvn clean validate

      - name: Compile Code
        run: |
          cd src/adservice
          mvn compile

      - name: Unit Test
        run: |
          cd src/adservice
          mvn test

  # Stage 2 (Parallel): Trivy File System Scan
  security-scan:
    name: "Trivy FS Scan"
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Pre-populate Maven Dependencies
        run: |
          cd src/adservice
          mvn dependency:tree -DskipTests

      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'src/adservice'
          severity: 'HIGH,CRITICAL'
          format: 'table'

  # Stage 3 (Parallel): SonarQube Code Analysis
  code-quality:
    name: "SonarQube Analysis"
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          cd src/adservice
          mvn compile org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  # Stage 4: Docker Build & Image Scan
  docker-build-and-scan:
    name: "Docker Build & Image Scan"
    needs: [security-scan, code-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Build
        run: |
          cd src/adservice
          docker build -t adservice:${{ github.run_number }} .

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'adservice:${{ github.run_number }}'
          severity: 'HIGH,CRITICAL'
          format: 'table'
